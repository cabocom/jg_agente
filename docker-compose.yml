services:
  # Base de datos PostgreSQL para checkpoints de LangGraph y tablas del Core (core_*)
  jg_agente_postgres:
    image: postgres:16-alpine
    container_name: jg_agente_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JG_AGENTE_POSTGRES_DB:-jg_agente}
      POSTGRES_USER: ${JG_AGENTE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${JG_AGENTE_POSTGRES_PASSWORD:-postgres}
    volumes:
      - jg_agente_postgres_data:/var/lib/postgresql/data
    ports:
      # Puerto 5433 en host para evitar colisiones con instancias existentes en 5432
      - "${JG_AGENTE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JG_AGENTE_POSTGRES_USER:-postgres} -d ${JG_AGENTE_POSTGRES_DB:-jg_agente}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jg_agente_net

  # Motor de ejecución cognitivo jg_agente (Execution Plane)
  jg_agente:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jg_agente
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      jg_agente_postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      AGENT_ID: ${AGENT_ID:-jg_agente_local}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      POSTGRES_HOST: jg_agente_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JG_AGENTE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${JG_AGENTE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${JG_AGENTE_POSTGRES_DB:-jg_agente}
      DATABASE_URL: postgresql+asyncpg://${JG_AGENTE_POSTGRES_USER:-postgres}:${JG_AGENTE_POSTGRES_PASSWORD:-postgres}@jg_agente_postgres:5432/${JG_AGENTE_POSTGRES_DB:-jg_agente}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://jg_dashboard:8080}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://jg_docker_socket_proxy:2375}
      CREDENTIALS_FILE: /app/data/.agent_credentials.json
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-}
      ENABLE_HEARTBEAT: ${ENABLE_HEARTBEAT:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${GLOBAL_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      GROQ_API_KEY: ${GLOBAL_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      AZURE_MAPS_KEY: ${GLOBAL_AZURE_MAPS_KEY:-${AZURE_MAPS_KEY:-}}
      PLUGINS_DIR: ${PLUGINS_DIR:-plugins}
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-}
    volumes:
      - jg_agente_data:/app/data
      - ./app:/app/app:ro
      - ./plugins:/app/plugins:ro
    ports:
      - "127.0.0.1:${AGENT_PORT:-8001}:8000"
    networks:
      - jg_agente_net
      - jg_network
      - jg_mcp_internal

networks:
  jg_agente_net:
    driver: bridge
  jg_network:
    name: jg_network
    external: true
  jg_mcp_internal:
    name: jg_mcp_internal
    external: true

volumes:
  jg_agente_postgres_data:
  jg_agente_data:
