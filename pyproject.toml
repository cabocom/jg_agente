[project]
name = "jg-agente"
version = "0.1.0"
description = "Motor Autónomo de Ejecución Cognitiva y Accionamiento (Execution Plane)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Javier Gálvez" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "uvicorn>=0.32.0",
    "docker>=7.0.0",
    "psutil>=6.0.0",
    "defusedxml>=0.7.1",
    "jg-agente-sdk>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "docs*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (manejado por ruff format)
    "B008",  # do not perform function calls in argument defaults (requerido por FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "jg_plugin_conversational", "jg_plugin_devops"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests", "plugins"]
pythonpath = [".", "plugins", "plugins/jg_plugin_conversational", "plugins/jg_plugin_devops"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
