stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "python-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

# ==========================================
# STAGE: LINT
# ==========================================

lint:ruff:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff
  script:
    - echo "🔍 Ejecutando análisis estático con Ruff..."
    - ruff check app tests
    - echo "🎨 Verificando formato de código..."
    - ruff format --check app tests

# ==========================================
# STAGE: TEST
# ==========================================

typecheck:mypy:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - echo "🧠 Ejecutando verificación de tipos estricta con MyPy..."
    - mypy app tests

test:pytest:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - echo "🧪 Ejecutando suite de tests automatizados..."
    - pytest tests/

# ==========================================
# STAGE: BUILD (Publicación en registry privado)
# ==========================================

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - USER_NAME="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    - PASS_WORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - HOST_NAME="${REGISTRY_HOST:-$CI_REGISTRY}"
    - |
      if [ -z "$USER_NAME" ] || [ -z "$PASS_WORD" ]; then
        echo "❌ ERROR: Variables de autenticación del registro (REGISTRY_USER, REGISTRY_PASSWORD) no encontradas."
        exit 1
      fi
    - echo "🔑 Iniciando sesión en el registro $HOST_NAME con usuario $USER_NAME..."
    - echo "$PASS_WORD" | docker login "$HOST_NAME" -u "$USER_NAME" --password-stdin
  script:
    - HOST_NAME="${REGISTRY_HOST:-$CI_REGISTRY}"
    - IMAGE_BASE="$HOST_NAME/$CI_PROJECT_PATH"
    - BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_COMMIT_REF_SLUG}"
    - SAFE_TAG=$(echo "$BRANCH_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_BASE:$SAFE_TAG"
    - echo "🛠️ Construyendo imagen Docker de jg_agente ($IMAGE_TAG)..."
    - docker build -t "$IMAGE_TAG" .
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        echo "🏷️ Etiquetando también como :latest para rama principal..."
        docker tag "$IMAGE_TAG" "$IMAGE_BASE:latest"
      fi
    - echo "🚀 Publicando imagen en $HOST_NAME..."
    - docker push "$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker push "$IMAGE_BASE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_TAG="$IMAGE_BASE:$CI_COMMIT_TAG"
        echo "🏷️ Publicando tag de release: $RELEASE_TAG..."
        docker tag "$IMAGE_TAG" "$RELEASE_TAG"
        docker push "$RELEASE_TAG"
      fi
    - echo "✅ Imagen publicada con éxito en $HOST_NAME con tag $SAFE_TAG."
