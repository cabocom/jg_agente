stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "python-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

# ==========================================
# STAGE: LINT
# ==========================================

lint:ruff:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff
  script:
    - echo "🔍 Ejecutando análisis estático con Ruff..."
    - ruff check app tests
    - echo "🎨 Verificando formato de código..."
    - ruff format --check app tests

# ==========================================
# STAGE: TEST
# ==========================================

typecheck:mypy:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
    - echo "📦 Instalando jg-agente-sdk para verificación estricta de tipos..."
    - |
      pip install "git+https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/javiergalvez-ia/jg_agente_sdk.git@main" || \
        echo "Advertencia: No se pudo clonar jg_agente_sdk con CI_JOB_TOKEN (se omiten tipos del SDK si no está instalado)"
  script:
    - echo "🧠 Ejecutando verificación de tipos estricta con MyPy..."
    - mypy app tests

test:pytest:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
    - echo "📦 Instalando jg-agente-sdk para validar paridad de contratos..."
    - |
      pip install "git+https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/javiergalvez-ia/jg_agente_sdk.git@main" || \
        echo "Advertencia: No se pudo clonar jg_agente_sdk con CI_JOB_TOKEN (se omite test de deriva si no está instalado)"
  script:
    - echo "🧪 Ejecutando suite de tests automatizados..."
    - pytest tests/

# ==========================================
# STAGE: BUILD (Publicación en registry privado)
# ==========================================

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - REGISTRY_HOST="${CI_REGISTRY:-registry.gitlab.com}"
    - REGISTRY_USER="${CI_REGISTRY_USER:-gitlab-ci-token}"
    - REGISTRY_PASS="${CI_REGISTRY_PASSWORD:-$CI_JOB_TOKEN}"
    - echo "🔑 Iniciando sesión en GitLab Container Registry ($REGISTRY_HOST)..."
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
  script:
    - REGISTRY_HOST="${CI_REGISTRY:-registry.gitlab.com}"
    - IMAGE_BASE="${CI_REGISTRY_IMAGE:-$REGISTRY_HOST/$CI_PROJECT_PATH}"
    - BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_COMMIT_REF_SLUG}"
    - SAFE_TAG=$(echo "$BRANCH_NAME" | tr '/' '-')
    - IMAGE_TAG="$IMAGE_BASE:$SAFE_TAG"
    - echo "🛠️ Construyendo imagen Docker limpia/depurable de jg_agente (código plano) -> $IMAGE_BASE:clean..."
    - docker build --build-arg OBFUSCATE=false -t "$IMAGE_BASE:clean" .
    - docker push "$IMAGE_BASE:clean"
    - echo "🛠️ Construyendo imagen Docker protegida de jg_agente (Cython .so) -> $IMAGE_TAG..."
    - docker build --build-arg OBFUSCATE=true -t "$IMAGE_TAG" .
    - if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$IMAGE_TAG" "$IMAGE_BASE:latest"; fi
    - echo "🚀 Publicando imagen protegida en $REGISTRY_HOST..."
    - docker push "$IMAGE_TAG"
    - if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push "$IMAGE_BASE:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$IMAGE_TAG" "$IMAGE_BASE:$CI_COMMIT_TAG" && docker push "$IMAGE_BASE:$CI_COMMIT_TAG"; fi
    - echo "✅ Imágenes de jg_agente publicadas con éxito en $REGISTRY_HOST (clean y $SAFE_TAG/latest)."
