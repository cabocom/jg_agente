stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "python-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

# ==========================================
# STAGE: LINT
# ==========================================

lint:ruff:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff
  script:
    - echo "🔍 Ejecutando análisis estático con Ruff..."
    - ruff check app tests
    - echo "🎨 Verificando formato de código..."
    - ruff format --check app tests

# ==========================================
# STAGE: TEST
# ==========================================

typecheck:mypy:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - echo "🧠 Ejecutando verificación de tipos estricta con MyPy..."
    - mypy app tests

test:pytest:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - echo "🧪 Ejecutando suite de tests automatizados..."
    - pytest tests/

# ==========================================
# STAGE: BUILD (Publicación de imagen definitiva)
# ==========================================

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "🛠️ Construyendo imagen definitiva de jg_agente..."
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - echo "🚀 Publicando imagen en GitLab Container Registry ($CI_REGISTRY_IMAGE)..."
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "🏷️ Publicando tag de release: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker tag "$CI_REGISTRY_IMAGE:latest" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - echo "✅ Imagen Docker publicada con éxito en el registro de contenedores."
